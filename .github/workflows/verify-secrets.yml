name: Verify Release Secrets

# Safe secret validator: decodes each secret and reports only pass/fail,
# which required keys are present (names only), and the keystore's public
# certificate fingerprint. It never prints any secret value.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
    steps:
      - name: Verify all secrets
        run: |
          set +x
          fail=0
          report() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          report "### local.properties secret"
          if [ -z "$LOCAL_PROPERTIES_BASE64" ]; then
            report "- ❌ LOCAL_PROPERTIES_BASE64 is EMPTY / not set"; fail=1
          # GNU base64 ignores newlines; strip other whitespace first to be safe.
          elif printf '%s' "$LOCAL_PROPERTIES_BASE64" | tr -d ' \t\r\n' | base64 -d > lp.txt 2>/dev/null && [ -s lp.txt ]; then
            report "- ✅ decodes ($(wc -c < lp.txt) bytes, $(grep -c '=' lp.txt || true) key lines)"
            report "- required key presence (name only, values never shown):"
            for k in TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY SIMKL_CLIENT_ID PREMIUMIZE_CLIENT_ID; do
              if grep -Eq "^[[:space:]]*${k}[[:space:]]*=[[:space:]]*.+$" lp.txt; then
                report "  - ✅ ${k}"
              else
                report "  - ⚠️ ${k} missing or empty"; fail=1
              fi
            done
          else
            report "- ❌ value is NOT valid base64"
            # Diagnose: did they store the RAW local.properties text instead of base64?
            if printf '%s' "$LOCAL_PROPERTIES_BASE64" | grep -Eq '^[[:space:]]*[A-Z0-9_]+[[:space:]]*='; then
              report "  - 🔎 looks like RAW local.properties text was stored, not its base64. Fix: base64 -i local.properties | gh secret set LOCAL_PROPERTIES_BASE64 -R hackerslash/NuvioTV"
            else
              report "  - 🔎 not decodable and not obvious plaintext; re-encode: base64 -i local.properties | gh secret set LOCAL_PROPERTIES_BASE64 -R hackerslash/NuvioTV"
            fi
            fail=1
          fi
          rm -f lp.txt

          report ""
          report "### release keystore secret"
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            report "- ❌ NUVIO_RELEASE_KEYSTORE_BASE64 EMPTY / not set"; fail=1
          elif printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > ks.jks 2>/dev/null && [ -s ks.jks ]; then
            report "- ✅ keystore decodes ($(wc -c < ks.jks) bytes)"
            if keytool -list -keystore ks.jks -storepass "$RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
              report "- ✅ store password opens the keystore"
              if keytool -list -keystore ks.jks -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
                report "- ✅ alias '$RELEASE_KEY_ALIAS' exists"
                fp="$(keytool -list -v -keystore ks.jks -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" 2>/dev/null | grep -i 'SHA256:' | head -1 | tr -d '[:space:]')"
                report "- keystore cert ${fp}  (public fingerprint)"
              else
                report "- ❌ alias '$RELEASE_KEY_ALIAS' NOT found"; fail=1
              fi
            else
              report "- ❌ store password does NOT open the keystore"; fail=1
            fi
          else
            report "- ❌ keystore value is NOT valid base64 (fix: base64 -i nuviotv.jks | gh secret set NUVIO_RELEASE_KEYSTORE_BASE64 -R hackerslash/NuvioTV)"; fail=1
          fi
          rm -f ks.jks

          report ""
          report "### plaintext secrets present?"
          [ -n "$RELEASE_KEY_ALIAS" ] && report "- ✅ NUVIO_RELEASE_KEY_ALIAS set" || { report "- ❌ NUVIO_RELEASE_KEY_ALIAS empty"; fail=1; }
          [ -n "$RELEASE_KEY_PASSWORD" ] && report "- ✅ NUVIO_RELEASE_KEY_PASSWORD set" || { report "- ❌ NUVIO_RELEASE_KEY_PASSWORD empty"; fail=1; }
          [ -n "$RELEASE_STORE_PASSWORD" ] && report "- ✅ NUVIO_RELEASE_STORE_PASSWORD set" || { report "- ❌ NUVIO_RELEASE_STORE_PASSWORD empty"; fail=1; }

          exit $fail
