name: Verify Release Secrets

# Safe secret validator: decodes each secret and reports only pass/fail,
# which required keys are present (names only), and the keystore's public
# certificate fingerprint. It never prints any secret value.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
    steps:
      - name: Verify LOCAL_PROPERTIES_BASE64
        run: |
          set +x
          echo "### local.properties secret" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$LOCAL_PROPERTIES_BASE64" ]; then
            echo "- ❌ secret is EMPTY / not set" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if ! printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 -d > lp.txt 2>/dev/null; then
            echo "- ❌ value is NOT valid base64 (re-encode with: base64 -i local.properties | gh secret set ...)" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "- ✅ decodes ($(wc -c < lp.txt) bytes, $(grep -c '=' lp.txt || true) key lines)" >> "$GITHUB_STEP_SUMMARY"
          echo "- required key presence (name only, values never shown):" >> "$GITHUB_STEP_SUMMARY"
          for k in TMDB_API_KEY TRAKT_CLIENT_ID TRAKT_CLIENT_SECRET NUVIO_SUPABASE_URL NUVIO_SUPABASE_ANON_KEY SIMKL_CLIENT_ID PREMIUMIZE_CLIENT_ID; do
            if grep -Eq "^[[:space:]]*${k}[[:space:]]*=[[:space:]]*.+$" lp.txt; then
              echo "  - ✅ ${k}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "  - ⚠️ ${k} missing or empty" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          rm -f lp.txt

      - name: Verify keystore secret + passwords
        run: |
          set +x
          echo "### release keystore secret" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "- ❌ NUVIO_RELEASE_KEYSTORE_BASE64 EMPTY / not set" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > ks.jks 2>/dev/null; then
            echo "- ❌ keystore value is NOT valid base64" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "- ✅ keystore decodes ($(wc -c < ks.jks) bytes)" >> "$GITHUB_STEP_SUMMARY"
          if keytool -list -keystore ks.jks -storepass "$RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "- ✅ store password opens the keystore" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ store password does NOT open the keystore" >> "$GITHUB_STEP_SUMMARY"; rm -f ks.jks; exit 1
          fi
          if keytool -list -keystore ks.jks -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1; then
            echo "- ✅ alias '$RELEASE_KEY_ALIAS' exists" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ❌ alias '$RELEASE_KEY_ALIAS' NOT found in keystore" >> "$GITHUB_STEP_SUMMARY"; rm -f ks.jks; exit 1
          fi
          # SHA-256 cert fingerprint is public (embedded in every signed APK) — safe to print.
          fp="$(keytool -list -v -keystore ks.jks -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" 2>/dev/null | grep -i 'SHA256:' | head -1)"
          echo "- keystore cert ${fp}" >> "$GITHUB_STEP_SUMMARY"
          rm -f ks.jks

      - name: Result
        run: echo "See the job summary for the secret report."
