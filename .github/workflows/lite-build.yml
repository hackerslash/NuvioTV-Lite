name: Build Lite Edition

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the built APKs as a GitHub release
        required: false
        type: boolean
        default: true
      release_tag:
        description: Release tag (blank = v<versionName> from the build, e.g. v1.0.0-lite)
        required: false
        type: string
        default: ""
      prerelease:
        description: Mark as prerelease (NOTE: in-app OTA ignores prereleases)
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lite-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build liteRelease APKs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare local properties (real keys)
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | tr -d ' \t\r\n' | base64 -d > local.properties
          else
            : > local.properties
          fi
          # Signing comes from env/secrets below, so drop any stale keystore path.
          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties || true

      - name: Prepare release keystore (real nuviotv key)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/nuviotv-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$ks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$ks"
            echo "NUVIO_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build liteRelease APKs
        run: ./gradlew :app:assembleLiteRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nuviotv-lite-release-${{ github.run_number }}
          path: app/build/outputs/apk/lite/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: ${{ inputs.publish_release }}
        run: |
          out=app/build/outputs/apk/lite/release
          mapfile -t apks < <(find "$out" -maxdepth 1 -type f -name '*.apk' | sort)
          if (( ${#apks[@]} == 0 )); then
            echo "No APKs produced." >&2
            exit 1
          fi
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then
            # Derive the tag from the build's own metadata so it can never drift from
            # versionName: the in-app updater compares the release tag against the
            # installed versionName, so a non-version tag (the old lite-build-<n>) made
            # every release look permanently newer.
            version="$(jq -r '.elements[0].versionName // empty' "$out/output-metadata.json")"
            if [ -z "$version" ]; then
              echo "Could not read versionName from $out/output-metadata.json" >&2
              exit 1
            fi
            tag="v$version"
          fi
          title="NuvioTV Lite Edition ($tag)"
          args=( "$tag" --target "${GITHUB_SHA}" --title "$title" --notes-file RELEASE_NOTES_LITE.md )
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=( --prerelease )
          fi
          gh release create "${args[@]}" "${apks[@]}"
